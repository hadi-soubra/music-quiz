<header class="topbar">
  <a class="brand" routerLink="/">
    <span class="brand-mark" aria-hidden="true">𝄞</span>
    <span>Who Composed It?</span>
  </a>
  <nav>
    <a routerLink="/" [class.active]="!onStudy()">Practice</a>
    <a routerLink="/study" [class.active]="onStudy()">Study</a>
  </nav>
</header>

<main>
  @if (player.loadFailed()) {
    <p class="banner">Couldn't load the YouTube player. Check your connection or disable any blocker for youtube.com, then reload.</p>
  }
  <router-outlet />
</main>

<!-- Hidden so the video title doesn't give the answer away. -->
<div class="player-host" aria-hidden="true"><div #playerHost></div></div>
